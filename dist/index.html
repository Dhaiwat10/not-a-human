<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf9">
  <title>not a human</title>
  <meta name="description" content="Select every square matching #7F807F. 73 matches. 60 seconds.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fafaf9'/%3E%3Cpath d='M7 7h18v18H7z' fill='none' stroke='%236452a3' stroke-width='2'/%3E%3Cpath d='m11 16 4 4 7-9' fill='none' stroke='%236452a3' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main class="experiment" data-state="idle">
    <div class="entry" id="entry">
      <button class="entry-button" id="start" type="button" role="checkbox" aria-checked="false" aria-controls="challenge-panel">
        <span class="checkbox" aria-hidden="true"></span>
        <span class="entry-copy"><span>I'm not a human</span><span class="entry-hint" id="entry-hint" hidden>Try again</span></span>
      </button>
    </div>
    <section id="challenge-panel" aria-labelledby="challenge-title" hidden>
      <div class="prompt-row">
        <h1 id="challenge-title" tabindex="-1">Select every square matching<br><span class="target"><span class="swatch" aria-hidden="true"></span><span id="target-color">#7F807F</span></span></h1>
        <div class="clock" aria-label="60 seconds available"><span id="timer">60.000</span><span class="unit">s</span></div>
      </div>
      <div class="field-wrap">
        <div class="field" id="field" role="group" aria-label="Color challenge, 1,024 squares"></div>
        <div class="time-track" aria-hidden="true"><div id="time-fill"></div></div>
      </div>
      <div class="field-footer"><span id="selection-count">0 <span class="muted">/ 73</span></span></div>
    </section>
    <span class="sr-only" id="announcement" role="status" aria-live="polite"></span>
  </main>
</body>
</html>
